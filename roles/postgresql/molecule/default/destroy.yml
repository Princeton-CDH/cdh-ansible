---
- name: Destroy
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Stop and remove container(s)
      community.docker.docker_container:
        name: "{{ item.name }}"
        state: absent
        force_kill: true
      loop: "{{ molecule_yml.platforms }}"

    - name: Remove network(s)
      community.docker.docker_network:
        name: "{{ item }}"
        state: absent
      loop: "{{ molecule_yml.platforms | selectattr('networks', 'defined') | map(attribute='networks') | flatten | map(attribute='name') | unique }}"

    - name: Remove dynamic inventory file
      ansible.builtin.file:
        path: "{{ molecule_ephemeral_directory }}/inventory/molecule_inventory.yml"
        state: absent
