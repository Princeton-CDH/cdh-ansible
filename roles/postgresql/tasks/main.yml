---
- name: Setup Postgres Client and Configuration
  when: postgres_setup_enabled | bool
  block:
    - name: Remove legacy PGDG apt sources (pre-signed-by cleanup)
      become: true
      # Older setups added extra pgdg source files pointing at a different keyring
      # (postgresql-archive-keyring.gpg): apt_postgresql_org_pub_repos_apt.list is
      # what the old apt_repository task auto-named, and pgdg.list came from the
      # PGDG script. Both conflict with the role-managed pgdg.sources below
      # (Signed-By: .../pgdg/apt.postgresql.org.asc), making apt fail with
      # "Conflicting values set for option Signed-By". Remove them so only
      # pgdg.sources remains.
      ansible.builtin.file:
        path: "/etc/apt/sources.list.d/{{ item }}"
        state: absent
      loop:
        - apt_postgresql_org_pub_repos_apt.list
        - pgdg.list

    - name: Make sure CA certificates and curl are available
      become: true
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: present
        update_cache: true

    - name: Ensure PostgreSQL apt key directory exists
      become: true
      ansible.builtin.file:
        path: /usr/share/postgresql-common/pgdg
        state: directory
        mode: "0755"

    - name: Install PostgreSQL apt repository key
      become: true
      ansible.builtin.get_url:
        url: "{{ postgres_apt_key_url }}"
        dest: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
        mode: "0644"

    - name: Configure PostgreSQL apt repository
      become: true
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/pgdg.sources
        mode: "0644"
        content: |
          Types: deb
          URIs: https://apt.postgresql.org/pub/repos/apt
          Suites: {{ ansible_distribution_release }}-pgdg
          Components: main
          Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
      register: postgres_apt_repo

    - name: Update apt cache after adding PostgreSQL repository
      become: true
      ansible.builtin.apt:
        update_cache: true
      when: postgres_apt_repo.changed

    - name: Install Python postgres support packages
      become: true
      ansible.builtin.apt:
       name:
         - python3-dev
         - python3-psycopg2
       state: present
       update_cache: true
       cache_valid_time: 3600

    - name: Install PostgreSQL client libraries from PGDG
      become: true
      ansible.builtin.apt:
        name:
          - libpq5
          - libpq-dev
          - "postgresql-client-{{ postgres_version }}"
        state: latest
        update_cache: true
        default_release: "{{ ansible_distribution_release }}-pgdg"

    - name: set fqdn for use in pg_hba
      ansible.builtin.set_fact:
        "pg_hba_fqdn={{ ansible_facts['fqdn'] }}"

    - name: set fqdn for use in pg_hba
      ansible.builtin.set_fact:
        "pg_hba_fqdn={{ ansible_facts['fqdn'] }}"

    - name: Ensure access to postgres server
      become: true
      ansible.builtin.lineinfile:
        path: "/etc/postgresql/{{ postgres_version }}/main/pg_hba.conf"
        line: "host    all             all             {{ pg_hba_fqdn }}       md5"
      delegate_to: "{{ postgres_host }}"
      notify: Reload remote postgres

- name: PostgreSQL - set client address for pg_hba
  ansible.builtin.set_fact:
    pg_hba_client_address: "{{ ansible_default_ipv4.address }}/32"

- name: PostgreSQL - ensure app host can access postgres server
  become: true
  ansible.builtin.lineinfile:
    path: "/etc/postgresql/{{ postgres_version }}/main/pg_hba.conf"
    line: "host    all             all             {{ pg_hba_client_address }}       md5"
    state: present
  delegate_to: "{{ postgres_host }}"
  notify: Reload remote postgres

- name: PostgreSQL - reload postgres before creating database resources
  ansible.builtin.meta: flush_handlers

- name: Create postgres user
  ansible.builtin.import_tasks: create_user.yml
  when: postgres_setup_enabled | bool

- name: Create postgres database
  ansible.builtin.import_tasks: create_db.yml
  when: postgres_setup_enabled | bool

- name: Backup postgres database
  ansible.builtin.import_tasks: backup_db.yml
  when: postgres_backup_enabled | bool

