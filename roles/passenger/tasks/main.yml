---

- name: Install and configure nginx+passenger
  become: true
  block:
    # Variable setup.
    - name: Passenger | Check that this Ubuntu release is supported
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_release in passenger_supported_releases
        fail_msg: >-
          The passenger role supports Ubuntu
          {{ passenger_supported_releases | join(', ') }}; this host reports
          {{ ansible_distribution }} {{ ansible_distribution_release }}.

    - name: Passenger | Load release-specific package versions
      ansible.builtin.include_vars: "{{ ansible_distribution_release }}.yml"

    - name: Define nginx_user.
      ansible.builtin.set_fact:
        nginx_user: "{{ __nginx_user }}"
      when: nginx_user is not defined

    - name: Phusion | Ensure apt https and gpg support are installed
      ansible.builtin.apt:
        name:
          - ca-certificates
          - gnupg
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Phusion | Ensure keyring directory exists
      ansible.builtin.file:
        path: /usr/local/share/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Phusion | Install apt signing keys
      ansible.builtin.include_tasks: apt_key.yml
      loop: "{{ passenger_apt_keys }}"
      loop_control:
        loop_var: passenger_key
        label: "{{ passenger_key.name }}"

    - name: Phusion | Add Phusion apt repo.
      ansible.builtin.apt_repository:
        repo: 'deb https://oss-binaries.phusionpassenger.com/apt/passenger {{ passenger_apt_release }} main'
        state: present
        filename: passenger
        update_cache: false

    # Priority must stay below 1001: the apt module pins a specifically
    # requested version at 1001, and an equal origin pin lets the newest
    # package in the repo win the tie, which makes exact-version installs fail
    # with "no available installation candidate". Pin values must also be
    # unquoted; apt treats the quotes as part of the origin name.
    - name: Phusion | Prefer Phusion Passenger packages
      ansible.builtin.copy:
        dest: /etc/apt/preferences.d/phusion-passenger
        owner: root
        group: root
        mode: "0644"
        content: |
          Package: passenger libnginx-mod-http-passenger
          Pin: origin oss-binaries.phusionpassenger.com
          Pin-Priority: 999

    # Refresh through the apt module so the version lookups below and the
    # install task read the package lists that were just downloaded.
    - name: Passenger | Update apt cache after adding repository
      ansible.builtin.apt:
        update_cache: true
      register: passenger_cache_update
      retries: 3
      delay: 5
      until: passenger_cache_update is success

    # Nginx and passenger installation.
    - name: Install Passenger and Nginx Passenger module from Phusion.
      tags:
        - setup
        - never
      block:
        - name: Passenger | Resolve compatible package versions
          ansible.builtin.include_tasks: resolve_versions.yml

        - name: Passenger | Install nginx and the matching Passenger module
          ansible.builtin.include_tasks: install_packages.yml

    # Nginx and passenger configuration.
    - name: Copy Nginx configuration into place.
      ansible.builtin.template:
        src: nginx.conf.j2
        dest: /etc/nginx/nginx.conf
        mode: "0644"
      notify: Restart nginx

    - name: Configure passenger virtual host.
      ansible.builtin.template:
        src: "{{ passenger_nginx_site_template }}"
        dest: /etc/nginx/sites-available/{{ passenger_site_config_name }}.conf
        mode: "0644"
      when: passenger_site_config_name != ""
      notify:
        - Restart nginx

    - name: Ensure passenger virtual host is enabled.
      ansible.builtin.file:
        src: /etc/nginx/sites-available/{{ passenger_site_config_name }}.conf
        dest: /etc/nginx/sites-enabled/{{ passenger_site_config_name }}.conf
        state: link
      when: passenger_site_config_name != ""

    - name: Ensure default virtual host is removed.
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      when: nginx_remove_default_vhost
      notify:
        - Restart nginx
