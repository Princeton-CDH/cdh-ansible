---
- name: Verify
  hosts: all
  gather_facts: false
  vars_files:
    - ../../defaults/main.yml
    - ../../vars/test.yml
  tasks:
    - name: Check passenger package status
      ansible.builtin.package:
        name: "{{ item }}"
        state: present
      check_mode: true
      register: pkg_status
      loop:
        - nginx-core
        - libnginx-mod-http-passenger
        - passenger

    - name: Test for passenger packages
      ansible.builtin.assert:
        that:
          - not pkg_status.changed

    - name: Read the Phusion apt source
      ansible.builtin.slurp:
        src: /etc/apt/sources.list.d/passenger.sources
      register: passenger_sources

    - name: Assert that the Phusion apt source is restricted to its keyrings
      ansible.builtin.assert:
        that:
          - passenger_signed_by in (passenger_sources.content | b64decode)
      vars:
        passenger_signed_by: >-
          Signed-By:
          /usr/local/share/keyrings/phusion_passenger_legacy.gpg,/usr/local/share/keyrings/phusion_passenger_2025.gpg

    # The apt module hides apt's notices, so run apt-get to capture them.
    - name: Run apt-get update
      ansible.builtin.command: apt-get update  # noqa: command-instead-of-module
      register: apt_update
      changed_when: false

    - name: Assert that apt does not report a missing Signed-By
      ansible.builtin.assert:
        that:
          - "'Missing Signed-By' not in apt_update.stdout + apt_update.stderr"

    - name: Stat application sites-available nginx config file
      ansible.builtin.stat:
        path: "/etc/nginx/sites-available/{{ app_name }}.conf"
      register: app_config

    - name: Assert that application nginx sites-available file is present
      ansible.builtin.assert:
        that:
          - "app_config.stat.exists"
          - "app_config.stat.isreg"   # regular file

    - name: Stat application sites-enabled nginx config file
      ansible.builtin.stat:
        path: "/etc/nginx/sites-enabled/{{ app_name }}.conf"
      register: app_config_enabled

    - name: Assert that application nginx sites-available file is present
      ansible.builtin.assert:
        that:
          - "app_config_enabled.stat.exists"
          - "app_config_enabled.stat.islnk"   # symbolic link

    - name: Stat nginx default config file
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: nginx_default_config

    - name: Assert that default nginx config file is not present
      ansible.builtin.assert:
        that:
          - "not nginx_default_config.stat.exists"

    - name: Check that nginx configtest passes
      ansible.builtin.command: nginx -t
      register: configtest_result
      changed_when: false

    - name: Check that nginx configtest passesp
      ansible.builtin.assert:
        that:
          - "'syntax is ok' in configtest_result.stderr"
          - "not configtest_result.failed"

    - name: Test that nginx is running and returns 200
      ansible.builtin.uri:
        url: http://localhost/
        return_content: yes
      register: site
      failed_when: "'Hello World' not in site.content"
