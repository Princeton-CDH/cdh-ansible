---
# tasks file for geniza_setup

- name: Ensure fonts directory exists
  become: true
  ansible.builtin.file:
    path: "{{ font_path }}"
    state: directory
    mode: '0775'
    owner: "{{ nginx_user }}"
    group: "{{ nginx_user }}"

- name: Extract licensed fonts
  become: true
  become_user: "{{ django_user }}"
  ansible.builtin.unarchive:
    src: geniza_fonts.vault
    dest: "{{ font_path }}"
    group: "{{ nginx_user }}"

- name: Ensure GitHub ssh key is present on the server.
  copy:
    src: "files/github_id_rsa"
    dest: "/home/{{ deploy_user }}/.ssh/github_id_rsa"
    mode: 0600
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"

- name: Make sure ssh config file exists
  ansible.builtin.file:
    path: "/home/{{ deploy_user }}/.ssh/config"
    mode: 0600
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    state: touch

- name: Configure ssh key for GitHub access in ~/.ssh/config
  become: true
  become_user: "{{ deploy_user }}"
  ansible.builtin.blockinfile:
    path: "/home/{{ deploy_user }}/.ssh/config"
    block: |
      Host github.com
       HostName github.com
       IdentityFile ~/.ssh/github_id_rsa

- name: Trust GitHub's ssh host keys
  become: true
  become_user: "{{ deploy_user }}"
  ansible.builtin.known_hosts:
    path: "/home/{{ deploy_user }}/.ssh/known_hosts"
    name: github.com
    key: "{{ item }}"
  loop: "{{ geniza_setup_github_host_keys }}"

- name: Ensure gitconfig is present on the server.
  copy:
    src: "files/gitconfig"
    dest: "/home/{{ deploy_user }}/.gitconfig"
    mode: 0600
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"

- name: Ensure base data directory exists and owned by deploy user
  ansible.builtin.file:
    state: directory
    dest: "{{ data_path }}"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"

# after a rebuild, restore the export timestamp saved by geniza_backup_state.yml
# so the next export picks up changes made since the last one on the old server;
# never overwrites a timestamp already on the server
- name: Restore last metadata export timestamp
  ansible.builtin.copy:
    src: "{{ geniza_setup_state_backup_dir }}/{{ geniza_setup_export_lastrun_file | basename }}"
    dest: "{{ geniza_setup_export_lastrun_file }}"
    force: false
    mode: "0644"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
  when:
    - inventory_hostname == cronjob_host
    - (geniza_setup_state_backup_dir ~ '/' ~ (geniza_setup_export_lastrun_file | basename)) is exists
