# molecule/default/molecule.yml
---
scenario:
  name: default

driver:
  name: docker

# test both Ubuntu releases in use on CDH servers
platforms:
  - name: jammy
    image: "ghcr.io/pulibrary/pul_containers:jammy_multi"
    command: "/lib/systemd/systemd"
    privileged: true
    cgroupns_mode: host
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    env:
      container: docker
    pre_build_image: true
  - name: noble
    image: "ghcr.io/pulibrary/vm-builds/ubuntu-24.04"
    command: ""  # image above already has the /sbin/init
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true

provisioner:
  name: ansible
  log: true
  env:
    ANSIBLE_CALLBACK_RESULT_FORMAT: yaml
    ANSIBLE_CALLBACKS_ENABLED: profile_tasks,profile_roles,timer
    ANSIBLE_FORCE_COLOR: "true"
    ANSIBLE_VERBOSITY: "2"
  config_options:
    defaults:
      roles_path: "$MOLECULE_PROJECT_DIRECTORY/.."
  inventory:
    group_vars:
      all:
        deploy_user_uid: 1002  # matches the servers; 1000 is the image's ubuntu user on noble
        runtime_env: production
  playbooks:
    converge: converge.yml
  options:
    tags: setup,all

verifier:
  name: ansible

lint: |
  set -e
  yamllint .
  ansible-lint
