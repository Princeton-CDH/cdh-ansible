---
# tasks file for deploy_user
- name: Deploy_user - set up deploy user
  become: true
  tags: [setup, never]
  block:
    - name: Deploy_user - ensure deploy user group exists with correct gid
      ansible.builtin.group:
        name: "{{ deploy_user }}"
        state: present
        gid: "{{ deploy_user_uid }}"

    - name: Deploy_user - create user
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        groups:
          - "{{ deploy_user }}"
          - "{{ webapp_group }}"
        home: "/home/{{ deploy_user }}"
        shell: "{{ deploy_user_shell }}"
        uid: "{{ deploy_user_uid }}"
        group: "{{ deploy_user }}"   # primary group

    - name: Deploy_user - ensure deploy user home directory ownership
      ansible.builtin.file:
        path: "/home/{{ deploy_user }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0755"

    - name: Deploy_user - create bash profile
      ansible.builtin.template:
        src: "bash_profile.j2"
        dest: "/home/{{ deploy_user }}/.profile"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0600"

    - name: Deploy_user - ensure .ssh directory exists
      ansible.builtin.file:
        path: "/home/{{ deploy_user }}/.ssh/"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0700"

    - name: Deploy_user - install private ssh key (if provided in files)
      ansible.builtin.copy:
        src: files/id_rsa
        dest: "/home/{{ deploy_user }}/.ssh/id_rsa"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0600"
      # Use an 'or' condition or ignore errors if the file isn't always present
      ignore_errors: true 

    - name: Deploy_user - generate SSH key for deploy user if missing
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        generate_ssh_key: true
        ssh_key_bits: 2048
        ssh_key_file: .ssh/id_rsa

    # Installing a private key does not refresh the matching .pub file, so the
    # stored public key can describe an older, unrelated key pair. Anything
    # that authorizes this host elsewhere (for example the Solr configset
    # rsync) would then trust a key this host cannot actually use.
    - name: Deploy_user - derive public key from the deploy user private key
      ansible.builtin.command:
        cmd: "/usr/bin/ssh-keygen -y -f /home/{{ deploy_user }}/.ssh/id_rsa"
      register: deploy_user_derived_pubkey
      changed_when: false

    - name: Deploy_user - store the derived public key
      ansible.builtin.copy:
        content: "{{ deploy_user_derived_pubkey.stdout | trim }}\n"
        dest: "/home/{{ deploy_user }}/.ssh/id_rsa.pub"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0644"

    - name: Deploy_user - add control machine public key to authorized_keys
      ansible.posix.authorized_key:
        user: "{{ deploy_user }}"
        key: "{{ lookup('file', 'files/id_rsa.pub') }}"

    - name: Deploy_user - allow "authorized_key" files
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        state: present
        backrefs: true
        regexp: '^#AuthorizedKeysFile(.*?)$'
        line: 'AuthorizedKeysFile\1'

    # Both allow-list edits below use backrefs, so they only ever extend an
    # existing directive and never lock anyone out by creating one. On VMs built
    # from 2025 onward the login allow-list lives in an sshd_config.d drop-in
    # and the main config has no AllowUsers line at all, so editing only the
    # main config silently does nothing and the deploy user keeps getting
    # "Permission denied (publickey,password)" despite a valid authorized key.
    - name: Deploy_user - find SSH allow-list drop-in files
      ansible.builtin.find:
        paths: /etc/ssh/sshd_config.d
        patterns: "*.conf"
        contains: '^Allow(Users|Groups)'
      register: deploy_user_sshd_dropins

    - name: Deploy_user - allow deploy user in drop-in user allow-list
      ansible.builtin.lineinfile:
        path: "{{ item.path }}"
        state: present
        backrefs: true
        regexp: '^AllowUsers(.*?)( ?)({{ deploy_user }})?$'
        line: 'AllowUsers\1 {{ deploy_user }}'
      loop: "{{ deploy_user_sshd_dropins.files }}"
      loop_control:
        label: "{{ item.path }}"
      notify:
        - Restart ssh

    # An AllowGroups directive restricts logins independently of AllowUsers,
    # so the deploy user's primary group has to be listed as well.
    - name: Deploy_user - allow deploy group in drop-in group allow-list
      ansible.builtin.lineinfile:
        path: "{{ item.path }}"
        state: present
        backrefs: true
        regexp: '^AllowGroups(.*?)( ?)({{ deploy_user }})?$'
        line: 'AllowGroups\1 {{ deploy_user }}'
      loop: "{{ deploy_user_sshd_dropins.files }}"
      loop_control:
        label: "{{ item.path }}"
      notify:
        - Restart ssh

    - name: Deploy_user - allow deploy user to SSH
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        state: present
        backrefs: true
        regexp: '^AllowUsers(.*?)( ?)({{ deploy_user }})?$'
        line: 'AllowUsers\1 {{ deploy_user }}'
      notify:
        - Restart ssh

    - name: Deploy_user - allow deploy group to SSH
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        state: present
        backrefs: true
        regexp: '^AllowGroups(.*?)( ?)({{ deploy_user }})?$'
        line: 'AllowGroups\1 {{ deploy_user }}'
      notify:
        - Restart ssh

    # by default, handlers run at the end of the playbook; we need the ssh restart
    # to take effect for subsequent tasks
    - name: Flush handlers (trigger ssh restart if needed)
      ansible.builtin.meta: flush_handlers

    - name: Deploy_user - create pulsys bash alias file
      ansible.builtin.template:
        src: "pulsys_bash_alias.j2"
        dest: "/home/{{ ansible_user }}/.bash_aliases"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"
      when: ansible_user != "root"

  rescue:
    - name: Close deployment as failed if error
      ansible.builtin.include_tasks: "{{ role_path }}/../create_deployment/tasks/fail.yml"
