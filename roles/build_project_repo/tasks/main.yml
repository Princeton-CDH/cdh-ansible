---
- name: Clone and deploy a project repository
  block:
    - name: Ensure base clone and install roots exist
      become: true
      ansible.builtin.file:
        path: "{{ item }}"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ install_root }}"
        - "{{ clone_root }}"
      tags: [setup]

    - name: Mark clone path as safe for git
      become: true
      become_user: "{{ deploy_user }}"
      ansible.builtin.command:
        cmd: "git config --global --add safe.directory {{ clone_root }}/{{ repo }}"
      changed_when: false

    - name: Primary clone of repository
      become: true
      become_user: "{{ deploy_user }}"
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ clone_root }}/{{ repo }}"
        version: "{{ gitref }}"
        depth: "{{ 1 if git_shallow_clone | default(false) else 0 }}"
      register: repo_info
      tags: [always]

    - name: Determine version of python app being deployed
      ansible.builtin.import_tasks: python_app_version.yml
      when:
        - python_app is defined
        - python_app_version is not defined
      tags: [always]

    - name: Create the specific deploy directory
      become: true
      ansible.builtin.file:
        path: "{{ deploy }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: '0755'
      tags: [setup]

    # Redeploying an already-deployed commit reuses its checkout, and git fetch
    # fails with "cannot open .git/FETCH_HEAD: Permission denied" if any of it
    # belongs to a UID that no longer exists (e.g. after deploy_user_uid
    # changed). Only orphaned files are re-owned: some groups deploy straight
    # into install_root, which also holds directories owned by www-data.
    - name: Re-own files in the deploy directory left by a removed UID
      become: true
      ansible.builtin.shell:
        cmd: >-
          test ! -e {{ deploy | quote }} ||
          find {{ deploy | quote }} -xdev \( -nouser -o -nogroup \)
          -print -exec chown -h {{ deploy_user }}:{{ deploy_user }} {} +
      register: build_project_repo_orphaned_files
      changed_when: build_project_repo_orphaned_files.stdout | length > 0
      tags: [always]

    - name: Mark deploy path as safe for git
      become: true
      become_user: "{{ deploy_user }}"
      ansible.builtin.command:
        cmd: "git config --global --add safe.directory {{ deploy }}"
      changed_when: false

    - name: Create shallow checkout of deploy branch to deploy directory
      become: true
      become_user: "{{ deploy_user }}"
      ansible.builtin.git:
        repo: "{{ clone_root }}/{{ repo }}"
        dest: "{{ deploy }}/"
        version: "{{ gitref }}"
        single_branch: true
        depth: 1
        force: true
      tags: [always]

  rescue:
    - name: Include failure tasks
      ansible.builtin.include_tasks: "../../create_deployment/tasks/fail.yml"
      ignore_errors: true
