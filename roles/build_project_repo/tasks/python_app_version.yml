---
- name: Determine python app version
  become: true
  become_user: "{{ deploy_user }}"
  tags: [python, python_app_version]
  run_once: true
  block:
    - name: Check if project has a pyproject.toml file
      ansible.builtin.stat:
        path: "{{ clone_root }}/{{ repo }}/pyproject.toml"
      register: pyproject_file

    - name: Try to get static version from pyproject.toml via uv
      # report version without installing dependencies
      ansible.builtin.shell:
        cmd: "uv version --short --offline"
        chdir: "{{ clone_root }}/{{ repo }}"
      register: py_app_version_uv
      when: pyproject_file.stat.exists
      changed_when: false
      # Dynamic versions and tool-only pyproject.toml files use package import.
      # Other errors (including a missing uv executable) should fail the task.
      failed_when:
        - py_app_version_uv.rc != 0
        - >-
          'We cannot get or set dynamic project versions'
          not in (py_app_version_uv.stderr | default(''))
        - >-
          'No `project` table found in:'
          not in (py_app_version_uv.stderr | default(''))

    # NOTE: dropped support for _version.py file (workaround for geotaste init imports)

    - name: Get the version via package import
      ansible.builtin.shell:
        cmd: "python3 -c 'import {{ python_app }}; print({{ python_app }}.__version__)'"
        chdir: "{{ clone_root }}/{{ repo }}"
      register: py_app_version_import
      when: py_app_version_uv.rc | default(1) != 0
      changed_when: false

    - name: Store python app version number
      ansible.builtin.set_fact:
        python_app_version: >-
          {{ py_app_version_uv.stdout
             if py_app_version_uv.rc | default(1) == 0
             else py_app_version_import.stdout }}

    - name: Report determined python app version
      ansible.builtin.debug:
        msg: "Deploying python app version {{ python_app_version }}"
