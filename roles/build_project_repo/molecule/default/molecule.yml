---
scenario:
  name: default
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup 
    - destroy
driver:
  name: docker
lint: |
  set -e
  yamllint .
  ansible-lint
# test both Ubuntu releases in use on CDH servers
platforms:
  - name: jammy
    image: "ghcr.io/pulibrary/vm-builds/ubuntu-22.04"
    command: ""  # image above already has the /sbin/init
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
  - name: noble
    image: "ghcr.io/pulibrary/vm-builds/ubuntu-24.04"
    command: ""  # image above already has the /sbin/init
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    create: create.yml
    destroy: destroy.yml
    converge: converge.yml
  config_options:
    defaults:
      remote_tmp: /tmp
      roles_path: "../../../"
  env:
    ANSIBLE_ROLES_PATH: "../../../"
  log: true
verifier:
  name: ansible
