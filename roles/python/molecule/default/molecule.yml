---
dependency:
  name: galaxy
  enabled: false
driver:
  name: docker
# test both Ubuntu releases in use on CDH servers: python 3.12 comes from
# deadsnakes on jammy and from the Ubuntu archive on noble
platforms:
  - name: jammy
    image: "ghcr.io/pulibrary/vm-builds/ubuntu-22.04"
    command: ""  # image above already has the /sbin/init
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
  - name: noble
    image: "ghcr.io/pulibrary/vm-builds/ubuntu-24.04"
    command: ""  # image above already has the /sbin/init
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      remote_tmp: /tmp
      # match ansible.cfg: on jammy, auto-discovery would pick the deadsnakes
      # python3.12, which cannot load jammy's system setuptools
      interpreter_python: /usr/bin/python3
  log: true
verifier:
  name: ansible
lint: |
  set -e
  yamllint .
  ansible-lint
