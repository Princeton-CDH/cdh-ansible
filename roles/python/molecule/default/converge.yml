---
# Run the main python task sequence for testing.

- name: Converge
  hosts: all
  # the role picks the apt suite from the Ubuntu release fact
  gather_facts: true
  vars_files: ../../defaults/main.yml

  tasks:
    - name: Include python role
      ansible.builtin.include_role:
        name: python
      vars:
        python_version: "3.12"
        python_user: python
