---
# Install a specified version of python. Uses a repository that provides newer
# versions of python, since Ubuntu doesn't (deadsnakes).
# 
# Note that Ubuntu splits up core python libraries into many packages; most are
# required to create the venv. Contents may differ depending on the version of
# python – for example, python3.8-distutils falls back to python3-distutils.
# 
# We include the generic python3-setuptools because it's required to create the
# virtual environment; later we can update pip and setuptools inside it.

- name: Add python apt repository
  become: true
  ansible.builtin.apt_repository:
    repo: ppa:deadsnakes/ppa

- name: Pin python packages to deadsnakes to avoid rc/alpha versions from distro mirror
  # The Princeton math mirror has a higher apt priority than deadsnakes, causing
  # pre-release builds (e.g. 3.11.0rc1) to be installed instead of the formal
  # release. 3.11.0rc1 lacks sys.get_int_max_str_digits, which torch/kraken
  # import unconditionally, causing a startup crash. This pin ensures deadsnakes
  # always wins. Can be removed if the Princeton mirror is fixed or removed.
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/deadsnakes-python
    content: |
      Package: python{{ python_version }} python{{ python_version }}-* libpython{{ python_version }}*
      Pin: release o=LP-PPA-deadsnakes
      Pin-Priority: 900
    mode: "0644"

- name: Install python and core libraries
  become: true
  ansible.builtin.apt:
    name:
      - python3-setuptools
      - python{{ python_version }}
      - python{{ python_version }}-venv
    state: latest
    update_cache: true

- name: Install distutils for python < 3.12
  become: true
  ansible.builtin.apt:
    name:
      - python{{ python_version }}-distutils
    state: latest
    update_cache: true
  when: python_version is version('3.12', '<')
