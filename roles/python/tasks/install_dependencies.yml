---
# Use uv to create a python virtual environment and install dependencies.
# Uses pyproject.toml by default; installs from a requirements.txt file
# if present and pyproject.toml is absent.

- name: Create python virtual environment and install dependencies with uv
  become: true
  become_user: "{{ python_user }}"
  environment:
    # run all uv commands in application directory
    UV_WORKING_DIR: "{{ python_app_path }}"
    # for backwards compatibilty, create and use virtualenv at the configured path;
    # since this is not the uv default, it must be specified for every uv command that requires loading the environment
    UV_PROJECT_ENVIRONMENT: "{{ python_venv_path }}"
  block:
    - name: Create python virtual environment with uv
      ansible.builtin.command:
        # NOTE: most projects specify python version in .python-version file, but for compatibility
        # with nginx, this needs to use the system-wide python3 which is installed based on configured python_version
        cmd: "uv venv --python=/usr/bin/python3 --prompt {{ python_venv_prompt }} --no-progress --clear"

    - name: Check for pyproject.toml file
      ansible.builtin.stat:
        path: "{{ pyproject_toml_file }}"
      register: _pyproject_file

    - name: Check for requirements.txt file # currently only ppa-django
      ansible.builtin.stat:
        path: "{{ python_requirements_file }}"
      register: _requirements_file

    - name: Install python dependencies from pyproject
      when:
        - _pyproject_file.stat.exists
      ansible.builtin.command:
        # optional groups config TBD
        cmd: "uv sync --no-dev"

    - name: Install python dependencies from requirements.txt
      when: _requirements_file.stat.exists
      ansible.builtin.command:
        cmd: "uv pip install -r requirements.txt"
        chdir: "{{ python_app_path }}"
        extra_args: "{{ pip_install_extra_args }}" # currently htr only

    - name: Install additional python requirements
      tags:
        - python-extra-deps
      ansible.builtin.command:
        cmd: "uv pip install {{ python_extra_packages }} {{ python_extra_packages_pip_extra_args }}"
      when: python_extra_packages is defined # currently prodigy/htr only
