---
# defaults for build_dependencies
common_dependencies:
  - acl
  - build-essential
  - curl
  - git
  - libssl-dev
  - nfs-common
  - nfs-kernel-server   # required for idmapd
  - python3
  - python3-pip
  - python3-setuptools
  - snapd
  - unzip
  - zip
  - wget
  - tmux
 # - python-virtualenv
# app-specific dependencies: override to install
app_dependencies: []
# set true in inventory; false for molecule and other non-server runs
running_on_server: false

# Keep the standalone version and release checksums in sync when upgrading.
uv_standalone_version: "0.13.10"
uv_standalone_checksums:
  x86_64: "bf65ac1a0af10f92c522d91ac096c7c0a39657647b155577e7836c2cbbb4526c"
  aarch64: "14590f644805a6234ffe071154340669e38137f38e60aa9629690119704107d2"
