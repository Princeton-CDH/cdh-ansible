---
- name: Converge
  hosts: all
  vars:
    running_on_server: false
  become: true
  pre_tasks:
    - name: Update cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
  tasks:
    # the role's tasks are tagged [setup, never] so playbooks only run them
    # with --tags setup; "always" on the import makes them run here as well
    - name: "Import build_dependencies"
      ansible.builtin.import_role:
        name: build_dependencies
      tags: always
