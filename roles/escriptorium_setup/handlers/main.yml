---
# handlers file for escriptorium
- name: Restart celery
  become: true
  ansible.builtin.command: "sudo supervisorctl restart {{ item }}"
  loop:
    - celery-main
    - celery-gpu
    - celery-live
    - celery-low-priority
- name: Restart django_channels
  become: true
  ansible.builtin.command: "sudo supervisorctl restart django_channels"

