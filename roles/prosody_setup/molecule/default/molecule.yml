---
dependency:   # no dependencies on other roles, so we turn this off
  name: galaxy
  enabled: false
driver:
  name: docker
# test both Ubuntu releases in use on CDH servers
platforms:
  - name: jammy
    image: "ghcr.io/pulibrary/vm-builds/ubuntu-22.04"
    command: ""  # image above already has the /sbin/init
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
  - name: noble
    image: "ghcr.io/pulibrary/vm-builds/ubuntu-24.04"
    command: ""  # image above already has the /sbin/init
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  # the pairtree directory task is tagged setup+never so it is skipped during
  # deploys; request it explicitly so verify can check it
  options:
    tags: all,setup
  config_options:
    defaults:
      remote_tmp: /tmp
      # yamllint disable-line rule:line-length
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/..:~/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles
  log: true   # useful when testing; otherwise logs aren't shown
verifier:
  name: ansible
lint: |       # standard config taken from molecule docs
  set -e
  yamllint .
  ansible-lint
