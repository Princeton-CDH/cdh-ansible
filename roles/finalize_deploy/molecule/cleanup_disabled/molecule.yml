---
# Cleanup disabled scenario: Tests that NO cleanup occurs when auto_cleanup_deploys is false
scenario:
  name: cleanup_disabled
# Use Docker to create test containers
driver:
  name: docker

# Define the test environment
platforms:
  - name: instance
    image: quay.io/pulibrary/jammy-ansible:latest
    pre_build_image: true

# Configure how ansible runs our tests
provisioner:
  name: ansible
  config_options:
    defaults:
      host_key_checking: false
      roles_path: "$MOLECULE_PROJECT_DIRECTORY/.."
  inventory:
    host_vars:
      instance:
        install_root: "/tmp/ansible_cleanup_test"  # Test directory for deployments
        deploy_keep_count: 3                # This value doesn't matter since cleanup is disabled
        auto_cleanup_deploys: false         # DISABLE cleanup functionality
        deploy_user: root                   # Run as root in test container to simplify test setup (avoids user creation complexity)
        # Created by prepare; all of them should remain after converge.
        # Shared here because facts set in prepare do not reach verify.
        fake_deployments:
          - "2.1.0-old1"
          - "2.2.0-old2"
          - "2.3.0-old3"
          - "3.0.0-keep1"
          - "3.1.0-keep2"
          - "3.2.0-keep3"
          - "4.0.0-previous"
          - "4.1.0-current"

# Use ansible verifier for verification tests
verifier:
  name: ansible
