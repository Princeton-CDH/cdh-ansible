[defaults]
inventory=./inventory
result_format=yaml
callback_result_format=yaml
host_key_checking=false
roles_path=roles
filter_plugins=filter_plugins
interpreter_python=/usr/bin/python3
collections_path = /runner/requirements_collections:./collections:~/.ansible/collections:/usr/share/ansible/collections
# vault identity list must be set via environment variable

[ssh-connection]
pipelining=true

[inventory]
enable_plugins = ini, yaml, auto, toml, script, host_list

