name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One deploy at a time; cancel any in-flight run when a newer commit arrives.
# ``actions/deploy-pages`` handles cancellation cleanly, so there's no risk of
# leaving the Pages site in a half-uploaded state.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Install docs dependencies
        run: uv sync --extra docs

      - name: Build Sphinx site
        # ``dirhtml`` writes ``foo/index.html`` instead of ``foo.html`` so
        # published URLs read ``/foo/`` (no ``.html`` suffix). GitHub Pages
        # serves both index.html and directory URLs, so this Just Works.
        run: uv run --extra docs sphinx-build -b dirhtml -W --keep-going docs docs/_build/html

      - name: Upload Pages artifact
        # if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
