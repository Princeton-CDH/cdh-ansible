name: Docs

on:
  # TODO: re-enable push on main once the workflow has been verified via PR.
  # push:
  #   branches: [main]
  pull_request:
  workflow_dispatch:

# One deploy at a time; cancel any in-flight run when a newer commit arrives.
# ``actions/deploy-pages`` handles cancellation cleanly, so there's no risk of
# leaving the Pages site in a half-uploaded state.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install docs dependencies
        run: uv sync --extra docs

      - name: Build Sphinx site
        run: uv run --extra docs sphinx-build -b html -W --keep-going docs docs/_build/html

      - name: Upload Pages artifact
        # if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    # if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
