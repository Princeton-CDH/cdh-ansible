[project]
name = "cdh-ansible"
version = "0.0.1"
requires-python = "==3.12.*"
dependencies = [
    "ansible==14.5.0",
    "ansible-builder==3.1.1",
    "ansible-compat>=26.9.0",
    "ansible-lint>=26.9.0",
    "molecule==26.9.0",
    "molecule-plugins[docker]==23.6.0",
    "passlib",
    "yamllint",
    "pre-commit",
    "psycopg2-binary",
    "pyyaml",
    "wheel",
]

[project.optional-dependencies]
docs = [
    "sphinx>=9.1.0",
    "myst-parser[linkify]>=5.1.0",
    "furo>=2025.12.19",
    "sphinx-copybutton>=0.5.2",
    "sphinxcontrib-mermaid>=2.1.1",
    "sphinx-datatables>=1",
    "sphinxcontrib-jquery>=4.1",
    # antsibull-docs generates RST from ``meta/argument_specs.yml`` for
    # local roles surfaced through a shim collection at build time.
    "antsibull-docs>=2.27.0",
]

[tool.uv]
package = false
