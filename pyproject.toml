[project]
name = "cdh-ansible"
version = "0.0.1"
requires-python = "==3.12.*"
dependencies = [
    "ansible==12.2.0",
    "ansible-core==2.19.11rc1",
    "ansible-builder==3.0.1",
    "ansible-compat>=25.1.0",
    "ansible-lint>=25.1.0",
    "molecule==6.0.3",
    "molecule-plugins[docker]==23.5.0",
    "passlib",
    "yamllint",
    "pre-commit",
    "psycopg2-binary",
    "pyyaml",
    "wheel",
]

[project.optional-dependencies]
docs = [
    "sphinx>=7",
    "myst-parser[linkify]>=3",
    "furo>=2024.8.6",
    "sphinx-copybutton>=0.5",
    "sphinxcontrib-mermaid>=1.0",
    "sphinx-datatables>=1",
    "sphinxcontrib-jquery>=4",
    # antsibull-docs generates RST from ``meta/argument_specs.yml`` for
    # local roles surfaced through a shim collection at build time.
    "antsibull-docs>=2",
]

[tool.uv]
package = false
