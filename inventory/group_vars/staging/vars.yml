---
###
# This file stores variables shared by all staging deploys
###

# configure staging to deploy develop branch by default
gitref: '{{ ref | default("develop", true) }}'
runtime_env: "staging"

# solr settings
# using solr staging on jammy vm
# - api access
solr_url: "http://lib-solr8d-staging.princeton.edu:8983/solr/"
solr_admin_url: '{{ solr_url }}admin/cores'
zk_host: "lib-zk-staging1d:2181,lib-zk-staging2d:2181,lib-zk-staging3d:2181/solr8"
# - server name for deploy setup
solr_server: "{{ groups['solr_staging'][0] }}"

# allow any deploy contexts (no ci/coverage checks before deploying)
deploy_contexts: []

# PUL staging VM (postgres v15)
postgres_host: lib-postgres-staging1.princeton.edu

# in staging, grant postgres app user permission to create db for replication
application_dbuser_role_attr_flags: "CREATEDB"

# nfs staging server
nfs_server: "128.112.203.82"
nfs_host_server: "lib-fs-staging.princeton.edu"

# in staging, the host domain should be set to host server for idmap to work
nfs_domain: "{{ nfs_host_server }}"

# turn on test banner for sites that support it
django_test_warning: true

# observability defaults
beyla_enabled: false
beyla_service_name: "{{ inventory_hostname }}"
beyla_environment: "{{ runtime_env }}"
beyla_otlp_endpoint: "http://127.0.0.1:4318"
beyla_otlp_protocol: "http/protobuf"
beyla_bpf_context_propagation: "all"

beyla_open_ports:
  - 80

# signoz / otel collector
otel_default_resource_attributes:
  host.name: "{{ inventory_hostname }}"
  service.name: "{{ beyla_service_name }}"
  service.version: "{{ runtime_env }}"
  environment: "{{ runtime_env }}"

otel_receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318

  filelog/nginx-access:
    include: ["/var/log/nginx/access.log*"]
    start_at: end
    operators:
      - type: regex_parser
        regex: '^(?P<remote_addr>[^\s]+) \((?P<remote_user>[^)]*)\) - - \[(?P<time_local>[^\]]+)\] "(?P<method>\S+) (?P<path>\S+) (?P<protocol>[^"]+)" (?P<status>\d+) (?P<body_bytes_sent>\d+) "(?P<http_referer>[^"]*)" "(?P<http_user_agent>[^"]*)"'
        parse_from: body
      - type: time_parser
        parse_from: attributes.time_local
        layout_type: strptime
        layout: '%d/%b/%Y:%H:%M:%S %z'
      - type: add
        field: attributes.log_type
        value: "{{ beyla_service_name }}_access"
      - type: add
        field: attributes.service_name
        value: "{{ beyla_service_name }}_access"

  filelog/nginx-error:
    include: ["/var/log/nginx/error.log*"]
    start_at: end
    operators:
      - type: add
        field: attributes.log_type
        value: "{{ beyla_service_name }}_error"
      - type: add
        field: attributes.service_name
        value: "{{ beyla_service_name }}"

  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu: {}
      disk: {}
      filesystem: {}
      load: {}
      memory: {}
      network: {}

otel_processors:
  batch:
    send_batch_max_size: 1024
    send_batch_size: 512
    timeout: 30s

otel_exporters:
  loadbalancing:
    routing_key: service
    protocol:
      otlp:
        timeout: 10s
        tls:
          insecure: true
        sending_queue:
          enabled: true
          num_consumers: 10
          queue_size: 5000
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
    resolver:
      static:
        hostnames:
          - k8s-staging1.lib.princeton.edu:30374
          - k8s-staging2.lib.princeton.edu:30374
          - k8s-staging3.lib.princeton.edu:30374

  debug:
    verbosity: basic

otel_service_pipelines:
  logs:
    receivers:
      - filelog/nginx-access
      - filelog/nginx-error
    processors:
      - resource
      - batch
    exporters:
      - loadbalancing
      - debug

  metrics:
    receivers:
      - otlp
      - hostmetrics
    processors:
      - resource
      - batch
    exporters:
      - loadbalancing
      - debug

  traces:
    receivers:
      - otlp
    processors:
      - resource
      - batch
    exporters:
      - loadbalancing
