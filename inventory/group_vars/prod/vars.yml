---
###
# This file stores variables shared by all production deploys
###

# all production deploys target real servers (not molecule containers)
running_on_server: true

# observability defaults
beyla_enabled: false
beyla_service_name: "{{ inventory_hostname }}"
beyla_environment: "{{ runtime_env }}"
beyla_otlp_endpoint: "http://127.0.0.1:4318"
beyla_otlp_protocol: "http/protobuf"
beyla_bpf_context_propagation: "all"

beyla_open_ports:
  - 80

# signoz / otel collector
otel_default_resource_attributes:
  host.name: "{{ inventory_hostname }}"
  service.name: "{{ beyla_service_name }}"
  service.version: "{{ runtime_env }}"
  environment: "{{ runtime_env }}"

otel_base_receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318

  filelog/nginx-access:
    include: ["/var/log/nginx/access.log*"]
    start_at: end
    operators:
      - type: regex_parser
        regex: '^(?P<remote_addr>[^\s]+) \((?P<remote_user>[^)]*)\) - - \[(?P<time_local>[^\]]+)\] "(?P<method>\S+) (?P<path>\S+) (?P<protocol>[^"]+)" (?P<status>\d+) (?P<body_bytes_sent>\d+) "(?P<http_referer>[^"]*)" "(?P<http_user_agent>[^"]*)"'
        parse_from: body
      - type: time_parser
        parse_from: attributes.time_local
        layout_type: strptime
        layout: '%d/%b/%Y:%H:%M:%S %z'
      - type: add
        field: attributes.log_type
        value: "{{ beyla_service_name }}_access"
      - type: add
        field: attributes.service_name
        value: "{{ beyla_service_name }}_access"

  filelog/nginx-error:
    include: ["/var/log/nginx/error.log*"]
    start_at: end
    operators:
      - type: add
        field: attributes.log_type
        value: "{{ beyla_service_name }}_error"
      - type: add
        field: attributes.service_name
        value: "{{ beyla_service_name }}"

  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu: {}
      disk: {}
      filesystem: {}
      load: {}
      memory: {}
      network: {}

# app-specific log receivers (e.g. JSON app logs) are defined in the app's
# group_vars as otel_app_log_receivers and added to the logs pipeline
otel_receivers: "{{ otel_base_receivers | combine(otel_app_log_receivers | default({})) }}"

otel_processors:
  batch:
    send_batch_max_size: 1024
    send_batch_size: 512
    timeout: 30s

otel_exporters:
  loadbalancing:
    routing_key: service
    protocol:
      otlp:
        timeout: 10s
        tls:
          insecure: true
        sending_queue:
          enabled: true
          num_consumers: 10
          queue_size: 5000
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
    resolver:
      static:
        hostnames:
          - k8s-prod1.lib.princeton.edu:32317
          - k8s-prod2.lib.princeton.edu:32317
          - k8s-prod3.lib.princeton.edu:32317

  debug:
    verbosity: basic

otel_service_pipelines:
  logs:
    receivers: "{{ ['filelog/nginx-access', 'filelog/nginx-error'] + (otel_app_log_receivers | default({}) | list) }}"
    processors:
      - resource
      - batch
    exporters:
      - loadbalancing
      - debug

  metrics:
    receivers:
      - otlp
      - hostmetrics
    processors:
      - resource
      - batch
    exporters:
      - loadbalancing
      - debug

  traces:
    receivers:
      - otlp
    processors:
      - resource
      - batch
    exporters:
      - loadbalancing
