- hosts: simrisk_cloud
  vars_files:
    - ../inventory/group_vars/sandbox/simrisk.yml
  connection: ssh
  remote_user: pulsys
  become: true
  roles:
    - role: pulibrary.princeton_ansible.common
      tags:
        - common
    - create_deployment
    - deploy_user
    - build_dependencies
    - build_project_repo
    - python
    - supervisor
    - configure_logging
    - finalize_deploy
    - close_deployment
  post_tasks:
    - name: Use supervisorctl to restart application
      ansible.builtin.command: "sudo supervisorctl restart simulatingrisk"
