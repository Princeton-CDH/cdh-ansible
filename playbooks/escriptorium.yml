---
# by default this playbook runs in the staging environment
# to run in production, pass '-e runtime_env=production'
- name: Deploy eScriptorium web application and task runners
  hosts: htr_{{ runtime_env | default('staging') }}
  pre_tasks:
    - name: Resolve htr2hpc git ref to exact commit hash (staging only)
      delegate_to: localhost
      run_once: true
      when: runtime_env | default('staging') == 'staging'
      ansible.builtin.command: >
        git ls-remote https://github.com/Princeton-CDH/htr2hpc.git {{ htr2hpc_gitref }}
      register: _htr2hpc_ls_remote
      changed_when: false

    - name: Set htr2hpc_deploy_ref to resolved commit hash (staging only)
      ansible.builtin.set_fact:
        htr2hpc_deploy_ref: "{{ hostvars['localhost']['_htr2hpc_ls_remote'].stdout_lines[-1].split('\t')[0] }}"
      when:
        - runtime_env | default('staging') == 'staging'
        - hostvars['localhost']['_htr2hpc_ls_remote'].stdout_lines | length > 0
  connection: ssh
  remote_user: pulsys
  become: true
  roles:
    - role: pulibrary.princeton_ansible.otel_collector
      when: runtime_env == "staging"
    - role: pulibrary.princeton_ansible.beyla
      when: runtime_env == "staging"
    - deploy_user
    - build_dependencies
    - build_project_repo
    - postgresql
    - passenger
    - nodejs # install npm dependencies and compile assets
    - configure_logging # logging directory must exist before running django commands
    - django
    - escriptorium_setup
    - role: supervisor
      tags:
        - supervisor
    - finalize_deploy
  tasks:
    - ansible.builtin.include_role: # use PUL ansible role to install local redis instance
        name: pulibrary.princeton_ansible.redis
    - name: Use supervisorctl to process any updated configurations
      ansible.builtin.command: "sudo supervisorctl update"
    - name: Restart supervisor apps to load any python/django configuration changes
      ansible.builtin.command: "sudo supervisorctl restart {{ item.name }}"
      loop: "{{ supervisor_programs }}"
      # skip absent programs because they have already been removed and cannot be restarted
      when: item.state | default('present') != 'absent'
    - name: Restart nginx after escriptorium patches are applied
      ansible.builtin.service:
        name: nginx
        state: restarted
  environment:
    # escriptorium local settings REPLACES default settings, must be specified
    # via env var for django manage commands to pick up
    DJANGO_SETTINGS_MODULE: escriptorium.local_settings
